name: Release

# semantic-release reads the Conventional Commits on main and decides whether a
# release is due (see RELEASING.md). Only then does it build the app, through
# scripts/build-release.sh, commit CHANGELOG.md and Casks/mac-runner.rb, tag the
# release and publish it on GitHub with the zipped app attached. This repository
# is also the Homebrew tap, so that commit is what `brew upgrade` picks up.
#
# The organization allows only GitHub-owned actions, pinned to a full commit SHA.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

# Push the release commit and tag, and publish the release. semantic-release's
# comments on issues and pull requests are off (.releaserc.json): this fork has
# issues disabled. Turning them on needs issues and pull-requests: write.
permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: macos-26
    timeout-minutes: 90
    env:
      # Developer ID signing and notarization need these secrets; without them the
      # app is signed ad hoc. Only whether they are set is exposed here.
      HAS_SIGNING_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE_BASE64 != '' && secrets.APPLE_CERTIFICATE_PASSWORD != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # semantic-release pushes with the token passed to it below.
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version
          node --version

      - name: Install semantic-release
        # Pinned here; no package.json or lockfile is committed.
        run: >-
          npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund
          semantic-release@25.0.9
          @semantic-release/changelog@7.0.0
          @semantic-release/git@11.0.1
          @semantic-release/exec@7.1.0
          conventional-changelog-conventionalcommits@10.4.0

      # ── Developer ID signing, only once the secrets exist ─────────────
      - name: Import signing certificate
        if: env.HAS_SIGNING_CERTIFICATE == 'true'
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail

          # Generate a random password for the temporary keychain
          KEYCHAIN_PASSWORD="$(uuidgen)"

          # Create a temporary keychain
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Import the certificate
          CERT_PATH="$RUNNER_TEMP/certificate.p12"
          echo "$APPLE_CERTIFICATE_BASE64" | base64 --decode > "$CERT_PATH"
          security import "$CERT_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          rm -f "$CERT_PATH"

          # Allow codesign to access the keychain without prompting
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Add temporary keychain to the search list
          # shellcheck disable=SC2046 # split the existing keychain list into arguments
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')

          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep 'Developer ID Application' | head -1 | awk -F '"' '{print $2}')"
          if [ -z "$IDENTITY" ]; then
            echo "Developer ID Application identity not found in imported keychain"
            exit 1
          fi

          # Save keychain metadata for later steps and cleanup.
          # scripts/build-release.sh signs with SIGNING_IDENTITY when it is set.
          {
            echo "KEYCHAIN_PATH=$KEYCHAIN_PATH"
            echo "KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD"
            echo "SIGNING_IDENTITY=$IDENTITY"
          } >> "$GITHUB_ENV"

      - name: Prepare notarization credentials
        if: env.HAS_SIGNING_CERTIFICATE == 'true'
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          set -euo pipefail

          if [ -n "${APPLE_API_KEY_BASE64:-}" ] && [ -n "${APPLE_API_KEY_ID:-}" ] && [ -n "${APPLE_API_ISSUER_ID:-}" ]; then
            API_KEY_PATH="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
            echo "$APPLE_API_KEY_BASE64" | base64 --decode > "$API_KEY_PATH"
            chmod 600 "$API_KEY_PATH"
            echo "NOTARY_API_KEY_PATH=$API_KEY_PATH" >> "$GITHUB_ENV"
            echo "Using App Store Connect API key for notarization"
          else
            echo "App Store Connect API key not configured; notarization falls back to Apple ID credentials"
          fi

      # ── Release ───────────────────────────────────────────────────────
      - name: Release
        env:
          # GITHUB_TOKEN cannot push the release commit while the organization's
          # ruleset requires pull requests on main; RELEASE_TOKEN can (RELEASING.md).
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          # Read by scripts/notarize.sh when a Developer ID identity was imported.
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npx semantic-release

      - name: Clean up signing keychain
        if: always()
        run: |
          if [ -n "${NOTARY_API_KEY_PATH:-}" ]; then
            rm -f "$NOTARY_API_KEY_PATH"
          fi
          if [ -n "${KEYCHAIN_PATH:-}" ] && security list-keychains | grep -q "signing.keychain-db"; then
            security delete-keychain "$KEYCHAIN_PATH"
            echo "Temporary keychain removed."
          fi
