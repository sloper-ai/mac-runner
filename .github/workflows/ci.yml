name: CI

# The organization allows only GitHub-owned actions, pinned to a full commit SHA.

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.head_ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test
    # Same image as the release; its default Xcode (26.x) has the Swift 6 toolchain
    # and macOS 26 SDK that Apple's Containerization package needs.
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Reset SwiftPM state
        run: |
          rm -rf .build
          rm -f Package.resolved
          rm -rf ~/Library/Caches/org.swift.swiftpm
          rm -rf ~/.swiftpm/cache
          swift package reset

      - name: Resolve dependencies
        run: |
          ulimit -n 65536 2>/dev/null || ulimit -n "$(ulimit -Hn)" 2>/dev/null || true
          swift package resolve

      - name: Build
        run: |
          ulimit -n 65536 2>/dev/null || ulimit -n "$(ulimit -Hn)" 2>/dev/null || true
          swift build --disable-sandbox

      - name: Test
        run: |
          ulimit -n 65536 2>/dev/null || ulimit -n "$(ulimit -Hn)" 2>/dev/null || true
          swift test --disable-sandbox
